<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe · Ambient Studio</title>
    <link rel="stylesheet" href="./studio.css" />
    <script type="module" src="./vibe.js"></script>
  </head>
  <body>
    <header>
      <a href="./">Vibes</a>
      <h1 id="pageTitle">Vibe</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
    </header>
    <main class="layout" data-view="vibe">
      <div>
        <form id="draft" class="panel" novalidate>
          <label>Name <input name="name" id="vibeName" required size="40" /></label>
          <label for="vibeBrief">Brief</label>
          <textarea id="vibeBrief" name="brief" rows="6"></textarea>
          <fieldset>
            <legend>Hard constraints: leave a field empty to leave it free</legend>
            <div id="constraintBox" class="constraints"></div>
          </fieldset>
          <p class="muted" id="constraintsText"></p>
          <label for="softTargets">Soft targets, as JSON (<code>{}</code> for none)</label>
          <textarea id="softTargets" name="softTargets" rows="2">{}</textarea>
          <ul id="draftErrors" class="errors"></ul>
          <div class="row">
            <button id="saveButton" type="submit">Save</button>
            <span class="muted">or <kbd>Cmd/Ctrl+Enter</kbd> in a field</span>
          </div>
        </form>

        <div id="savedOnly">
          <section aria-labelledby="sessions-heading">
            <div class="row">
              <h2 id="sessions-heading">Sessions</h2>
              <button data-action="startSession" type="button">Start a session</button>
            </div>
            <ul id="sessionList" class="list"></ul>
          </section>

          <section aria-labelledby="notes-heading">
            <h2 id="notes-heading">Notes</h2>
            <ul id="noteList" class="list"></ul>
            <form id="noteForm" class="panel">
              <label for="noteText">A note for the prompt</label>
              <textarea id="noteText" name="text" rows="2"></textarea>
              <div class="row"><button type="submit">Add the note</button></div>
            </form>
          </section>

          <section aria-labelledby="ratings-heading">
            <h2 id="ratings-heading">Ratings, newest first</h2>
            <ul id="ratingList" class="list"></ul>
            <p id="noRatings" class="muted">No ratings yet.</p>
          </section>

          <section aria-labelledby="revisions-heading">
            <h2 id="revisions-heading">Revisions, newest first</h2>
            <ul id="revisionList" class="list"></ul>
          </section>
        </div>
      </div>
      <aside aria-label="Keys">
        <dl id="keys-vibe" class="keys"></dl>
      </aside>
    </main>

    <template id="choice-field">
      <label>
        <span class="field-name" data-part="label">constraint</span>
        <select data-part="input"><option value="">free</option></select>
      </label>
    </template>
    <template id="number-field">
      <label>
        <span class="field-name" data-part="label">constraint</span>
        <input data-part="input" type="number" inputmode="decimal" />
      </label>
    </template>
    <template id="range-field">
      <div>
        <span class="field-name" data-part="label">constraint</span>
        <div class="row">
          <label>from <input data-part="min" type="number" inputmode="decimal" /></label>
          <label>to <input data-part="max" type="number" inputmode="decimal" /></label>
        </div>
      </div>
    </template>
    <template id="voices-field">
      <div>
        <span class="field-name" data-part="label">constraint</span>
        <div class="row" data-part="options"></div>
      </div>
    </template>
    <template id="voice-option">
      <label><input data-part="input" type="checkbox" /> <span data-part="type">voice</span></label>
    </template>
    <template id="line-item">
      <li class="card">
        <span data-part="line"></span>
        <span class="muted" data-part="time"></span>
      </li>
    </template>
    <template id="session-item">
      <li class="card">
        <a href="./" data-part="link">session</a>
        <span class="muted" data-part="time"></span>
      </li>
    </template>
    <template id="revision-item">
      <li class="card">
        <details>
          <summary data-part="summary"></summary>
          <p data-part="brief"></p>
          <pre data-part="constraints"></pre>
        </details>
      </li>
    </template>
  </body>
</html>
