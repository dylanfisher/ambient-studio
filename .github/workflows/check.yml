name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versions come from the pinned files: packageManager in package.json, .nvmrc, and
      # sidecar/.python-version (uv downloads that Python itself).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/setup
      - run: ./scripts/check
