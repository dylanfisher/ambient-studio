[project]
name = "ambient-sidecar"
version = "0.0.0"
description = "ML sidecar for Ambient Studio: CLAP embeddings, preference models, optimizers, LoRA training."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cma==4.5.0",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
